[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jina-sagemaker"
dynamic = ["version"]
description = "Python library for the Jina endpoints in AWS Sagemaker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jina AI", email = "hello@jina.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.34",
    # sagemaker 3.x is a namespace package that drops the legacy top-level API
    # (sagemaker.Session, sagemaker.ModelPackage, sagemaker.get_execution_role).
    # Stay on the 2.x line until this library is ported to the new SDK.
    "sagemaker>=2.200,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    # Notebook-import sanity test in tests/test_notebooks.py parses the
    # .ipynb files and verifies their jina_sagemaker imports resolve.
    "nbformat>=5",
]

[project.urls]
Homepage = "https://github.com/jina-ai/jina-sagemaker"
Repository = "https://github.com/jina-ai/jina-sagemaker"
Changelog = "https://github.com/jina-ai/jina-sagemaker/releases"

[tool.hatch.version]
path = "jina_sagemaker/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/jina_sagemaker",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["jina_sagemaker"]

[tool.ruff]
line-length = 127
target-version = "py310"
# Notebooks and examples are customer-facing reference material; their
# formatting is curated by the docs team, not enforced by CI.
extend-exclude = ["notebooks", "examples"]

[tool.ruff.format]
# Match the prior `black -S` (skip-string-normalization) behaviour so this
# swap does not churn every single- vs double-quoted literal in the repo.
quote-style = "preserve"

[tool.ruff.lint]
# E + W: pycodestyle errors/warnings (covers the old flake8 E9 set).
# F:     pyflakes (undefined names, unused imports, etc. — old F63/F7/F82).
# I:     isort import-order rules (replaces the standalone isort tool).
# C90:   mccabe complexity (replaces flake8 --max-complexity).
select = ["E", "F", "I", "C90", "W"]

[tool.ruff.lint.mccabe]
# Matches the previous flake8 --max-complexity=20 cap. Lower this once
# create_async_endpoint and embed() are simpler.
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["jina_sagemaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration/ talks to real SageMaker endpoints and is opt-in only.
# Its conftest.py also skips every test unless RUN_INTEGRATION_TESTS=1,
# but excluding it from default collection avoids printing a noisy
# wall-of-skips during normal `pytest` runs.
norecursedirs = ["tests/integration"]
